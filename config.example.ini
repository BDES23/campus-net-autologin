# 校园网自动登录配置。密码不在这里，密码存在 Windows 凭据管理器。
# 修改后无需重新安装自启任务。

[portal]
base_url = http://10.0.0.1
login_path = /api/account/login
check_path = /api/account/check
status_path = /api/account/status
logout_path = /api/account/logout
csrf_path = /api/csrf-token
csrf_header = X-CSRF-Token
probe_url = http://www.gstatic.com/generate_204
entry_template = http://10.0.0.1/api/r/1?wlanuserip={ip}
extra_headers = 

[account]
username = 
isp = local
time_limit = 

[network]
interface = WLAN
ssid_whitelist = 
verify_after_login = true

[policy]
retries = 3
retry_backoff = 2.0
request_timeout = 8
guard_interval = 300
on_captcha = stop

[logging]
dir = logs
level = INFO
max_bytes = 1048576
backup_count = 5

